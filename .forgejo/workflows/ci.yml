name: CI

on:
    push:
        branches:
            - "**"
    workflow_dispatch:
    schedule:
        - cron: "23 3 * * *"

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NIX_CONFIG: |
        max-jobs = 2
        cores = 2
    CARGO_BUILD_JOBS: "2"
    CARGO_INCREMENTAL: "0"
    CARGO_PROFILE_DEV_DEBUG: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
    check:
        runs-on: gaia-runner
        timeout-minutes: 120
        container:
            image: fleet-ci:latest
        steps:
            - name: Checkout
              uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - name: Fast formatting and runner regressions
              run: |
                  nix develop --no-update-lock-file --command cargo fmt --all --check
                  nix develop --no-update-lock-file --command make hooks-check
            - name: Build and audited offline checks
              run: nix flake check --no-update-lock-file --print-build-logs --keep-going

    workspace:
        needs: check
        runs-on: gaia-runner
        timeout-minutes: 185
        container:
            image: fleet-ci:latest
        steps:
            - name: Checkout
              uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - name: Checkout pinned TypeScript parity reference
              uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  ref: 239dbe344fcaf671af9898906ff952be73995614
                  path: ts-reference
                  persist-credentials: false
            - name: Build pinned TypeScript parity reference
              run: nix build ./ts-reference#prime-agent --no-update-lock-file --out-link "$RUNNER_TEMP/pa-ts-reference"
            - name: Full workspace gates with private state and a real kernel
              run: |
                  export PA_TS_BINARY="$RUNNER_TEMP/pa-ts-reference/bin/prime-agent"
                  export PA_TS_REFERENCE="$GITHUB_WORKSPACE/ts-reference"
                  nix develop --no-update-lock-file --command python3 -B scripts/check_workspace.py --require-ts-reference --timeout 10800
