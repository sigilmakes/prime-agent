[project]
name = "prime-agent-runtime"
version = "0.1.0"
description = "Kernel-side runtime shim for Prime Agent recursion"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "tyro",
]

[dependency-groups]
dev = ["dill"]
kernel = [
  "pillow>=10.0.0",
  "dill",
  "requests",
  "httpx",
  "pyyaml",
  "tomli",
  "python-dotenv",
  "pandas",
  "numpy",
  "scipy",
  "beautifulsoup4",
  "lxml",
  "pydantic",
  "tyro",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]
